# Merged over the connector's default configuration by start_lichess.py.
# Token is supplied through an environment variable or a hidden prompt.
token: supplied-at-runtime
engine:
  dir: ./engines
  name: CourseMinimax
  protocol: homemade
  ponder: false
  draw_or_resign:
    offer_draw_enabled: false
challenge:
  concurrency: 1
  accept_bot: true
  only_bot: true
  min_base: 300
  max_base: 1800
  min_increment: 3
  max_increment: 20
  variants: [standard]
  time_controls: [blitz, rapid, classical]
  modes: [casual]
matchmaking:
  allow_matchmaking: false
greeting:
  hello: ''
  goodbye: ''
  hello_spectators: ''
  goodbye_spectators: ''
pgn_directory: ../game_records
